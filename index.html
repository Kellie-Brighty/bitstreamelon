<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitstream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Bebas+Neue&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            width: 100vw;
            overflow-x: hidden;
            position: relative;
        }

        .section {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* First section - Split image effect */
        .split-section {
            position: relative;
            height: 200vh; /* Double height for scroll effect */
        }

        .image-container {
            position: sticky;
            top: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        .image-top {
            clip-path: polygon(0 0, 100% 0, 100% 0%, 0 0%);
            transition: clip-path 0.1s linear;
        }

        .image-bottom {
            clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%);
            transition: clip-path 0.1s linear;
        }

        .dark-texture {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0,0,0,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.1) 0%, transparent 50%),
                linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            background-size: 200% 200%;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .dark-texture::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
        }

        /* Second section - Dark panel with content */
        .content-section {
            position: relative;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0,0,0,0.2) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,0,0,0.2) 0%, transparent 50%),
                linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            background-size: 200% 200%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .content-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
            pointer-events: none;
        }

        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.15), transparent);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100px) translateX(0);
                opacity: 0;
            }
        }

        .bubble-1 { width: 60px; height: 60px; left: 10%; animation-duration: 15s; animation-delay: 0s; }
        .bubble-2 { width: 40px; height: 40px; left: 20%; animation-duration: 18s; animation-delay: 2s; }
        .bubble-3 { width: 80px; height: 80px; left: 30%; animation-duration: 20s; animation-delay: 4s; }
        .bubble-4 { width: 50px; height: 50px; left: 50%; animation-duration: 16s; animation-delay: 1s; }
        .bubble-5 { width: 70px; height: 70px; left: 60%; animation-duration: 19s; animation-delay: 3s; }
        .bubble-6 { width: 45px; height: 45px; left: 70%; animation-duration: 17s; animation-delay: 5s; }
        .bubble-7 { width: 55px; height: 55px; left: 80%; animation-duration: 21s; animation-delay: 2.5s; }
        .bubble-8 { width: 65px; height: 65px; left: 15%; animation-duration: 22s; animation-delay: 6s; }
        .bubble-9 { width: 35px; height: 35px; left: 40%; animation-duration: 14s; animation-delay: 1.5s; }
        .bubble-10 { width: 75px; height: 75px; left: 90%; animation-duration: 23s; animation-delay: 4.5s; }

        .light-streak {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            z-index: 2;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .central-panel {
            position: relative;
            max-width: 600px;
            width: 100%;
            z-index: 3;
            background: white;
            border-radius: 20px;
            padding: 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        .curved-object {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e4bc 50%, #d4af37 100%);
            border-radius: 20px 20px 0 0;
            position: relative;
            overflow: hidden;
        }

        .curved-object::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
            50% { transform: translate(-50%, -50%) rotate(180deg); }
        }

        .panel-content {
            padding: 30px 40px 40px;
            text-align: center;
        }

        .contract-address {
            font-family: 'Rajdhani', monospace;
            font-size: 12px;
        font-weight: 600;
            color: white;
            margin: 25px 0;
            word-break: break-all;
            padding: 12px 15px;
            background: black;
            border-radius: 8px;
            text-align: center;
            letter-spacing: 1px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 25px 0;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            background: white;
            border-radius: 50%;
            padding: 8px;
            text-decoration: none;
            color: inherit;
        }

        .social-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .social-icon svg {
            width: 24px;
            height: 24px;
            fill: black;
            color: black;
        }

        .social-icon:hover {
            transform: scale(1.1);
        }

        .bitstream-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            color: #00ff00;
            text-transform: uppercase;
            font-weight: 900;
            margin: 25px 0;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .info-boxes {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }

        .info-box {
            background: #1a1a1a;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #00ff00;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .buy-now-button {
            position: fixed;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: #00ff00;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            padding: 10px 20px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            z-index: 100;
            transition: opacity 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .buy-now-button:hover {
            opacity: 0.8;
        }

        /* Mobile Responsive Styles */
        @media (max-width: 768px) {
            .content-section {
                padding: 20px 15px;
            }

            .central-panel {
                max-width: 95%;
                margin: 0 auto;
            }

            .curved-object {
                height: 150px;
            }

            .panel-content {
                padding: 20px 20px 30px;
            }

            .bitstream-title {
                font-size: 28px;
                letter-spacing: 2px;
                margin: 20px 0;
            }

            .contract-address {
                font-size: 10px;
                padding: 10px 12px;
                margin: 20px 0;
            }

            .social-icons {
                gap: 12px;
                margin: 20px 0;
            }

            .social-icon {
                width: 35px;
                height: 35px;
                padding: 6px;
            }

            .social-icon svg {
                width: 20px;
                height: 20px;
            }

            .info-box {
                padding: 12px 15px;
                font-size: 14px;
                letter-spacing: 1px;
            }

            .buy-now-button {
                top: 15px;
                right: 15px;
                font-size: 14px;
                padding: 8px 16px;
            }

            .light-streak {
                top: 45%;
            }
        }

        @media (max-width: 480px) {
            .bitstream-title {
                font-size: 24px;
                letter-spacing: 1px;
            }

            .contract-address {
                font-size: 9px;
                padding: 8px 10px;
            }

            .social-icon {
                width: 32px;
                height: 32px;
            }

            .info-box {
                padding: 10px 12px;
                font-size: 12px;
            }

            .buy-now-button {
                font-size: 12px;
                padding: 6px 12px;
            }
      }
    </style>
  </head>
<body>
    <!-- Split section with image -->
    <div class="split-section" id="splitSection">
        <div class="image-container">
            <div class="image-wrapper">
                <img src="bitstream.jpg" alt="Bitstream" class="background-image image-top" id="imageTop">
                <img src="bitstream.jpg" alt="Bitstream" class="background-image image-bottom" id="imageBottom">
                <div class="dark-texture" id="darkTexture"></div>
            </div>
        </div>
    </div>

    <!-- Content section with dark panel -->
    <div class="content-section">
        <div class="bubbles">
            <div class="bubble bubble-1"></div>
            <div class="bubble bubble-2"></div>
            <div class="bubble bubble-3"></div>
            <div class="bubble bubble-4"></div>
            <div class="bubble bubble-5"></div>
            <div class="bubble bubble-6"></div>
            <div class="bubble bubble-7"></div>
            <div class="bubble bubble-8"></div>
            <div class="bubble bubble-9"></div>
            <div class="bubble bubble-10"></div>
        </div>
        <div class="light-streak"></div>
        <div class="central-panel">
            <div class="curved-object"></div>
            <div class="panel-content">
                <div class="contract-address">
                    CA: 0x24D133aF672C873f07DEAC38324a2C474a48435F
                </div>
                <div class="social-icons">
                    <a href="https://t.me/Bitstreamcoin" target="_blank" rel="noopener noreferrer" class="social-icon">
                        <svg viewBox="0 0 24 24" fill="black">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </a>
                    <a href="https://x.com/bitstreamoneth" target="_blank" rel="noopener noreferrer" class="social-icon">
                        <svg viewBox="0 0 24 24" fill="black">
                            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                        </svg>
                    </a>
                    <a href="https://dexscreener.com/ethereum/0x24D133aF672C873f07DEAC38324a2C474a48435F" target="_blank" rel="noopener noreferrer" class="social-icon">
                        <img src="dexscreener.webp" alt="DexScreener">
                    </a>
                    <a href="https://www.dextools.io/app/en/ether/pair-explorer/0x24D133aF672C873f07DEAC38324a2C474a48435F" target="_blank" rel="noopener noreferrer" class="social-icon">
                        <img src="dextools.png" alt="DexTools">
                    </a>
                </div>
                <div class="bitstream-title">BITSTREAM</div>
                <div class="info-boxes">
                    <div class="info-box">LP BURNT</div>
                    <div class="info-box">RENOUNCED</div>
                    <div class="info-box">0% TAX</div>
                    <div class="info-box">1,000,000,000 TOTAL SUPPLY</div>
                </div>
            </div>
        </div>
    </div>

    <a href="https://dexscreener.com/ethereum/0x24D133aF672C873f07DEAC38324a2C474a48435F" target="_blank" rel="noopener noreferrer" class="buy-now-button">BUY NOW</a>

    <script>
        const splitSection = document.getElementById('splitSection');
        const imageTop = document.getElementById('imageTop');
        const imageBottom = document.getElementById('imageBottom');
        const darkTexture = document.getElementById('darkTexture');
        const splitSectionHeight = splitSection.offsetHeight;
        const viewportHeight = window.innerHeight;

        function updateSplit() {
            const scrollY = window.scrollY;
            const maxScroll = splitSectionHeight - viewportHeight;
            const scrollProgress = Math.min(scrollY / maxScroll, 1);

            // Calculate diagonal split percentage
            const topProgress = scrollProgress;
            const bottomProgress = 1 - scrollProgress;

            // Update clip paths for diagonal split
            const topClip = topProgress * 100;
            const bottomClip = bottomProgress * 100;

            // Diagonal split from top-left to bottom-right
            imageTop.style.clipPath = `polygon(0 0, 100% 0, ${100 - topClip * 0.5}% ${topClip}%, 0 ${topClip}%)`;
            imageBottom.style.clipPath = `polygon(0 ${100 - bottomClip}%, ${100 - bottomClip * 0.5}% ${100 - bottomClip}%, 100% 100%, 0 100%)`;

            // Fade in dark texture as split progresses
            darkTexture.style.opacity = scrollProgress * 0.7;
        }

        window.addEventListener('scroll', updateSplit);
        window.addEventListener('resize', () => {
            const newHeight = splitSection.offsetHeight;
            updateSplit();
        });

        // Initial call
        updateSplit();
    </script>
  </body>
</html>
